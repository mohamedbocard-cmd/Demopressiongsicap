spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/Demopressing?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:diagana}
spring.datasource.password=${DB_password:diagana}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.sql.init.platform=postgresql
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=${DB_USER:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.show-sql=true
server.port=8165
spring.thymeleaf.cache = false
#spring.main.allow-circular-references= true
spring.mvc.format.date=dd-MM-yyyy
server.servlet.context-path=/api
logging.config=classpath:log4j2.xml
logging.level.org.springframework.web=DEBUG
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

logging.level.org.springframework.security=TRACE




