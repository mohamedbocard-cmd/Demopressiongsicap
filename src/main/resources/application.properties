spring.datasource.url=jdbc:postgresql://localhost:5433/Demopressing
spring.datasource.username=${DB_USER:diagana}
spring.datasource.password=${DB_password:diagana}
spring.datasource.driverClassName=${DB_DRIVER:org.postgresql.Driver}
spring.sql.init.platform=postgreSQL
# ===============================
# CONFIGURATION JPA / HIBERNATE
# ===============================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
#validate ,update,create-drop,none
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.show-sql=true
server.port=8165
# ===============================
# CONFIGURATION THYMELEAF
# ===============================

spring.thymeleaf.cache = false
spring.mvc.format.date=dd-MM-yyyy
server.servlet.context-path=/api
logging.config=classpath:log4j2.xml
logging.level.org.springframework.web=DEBUG
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true
logging.level.org.springframework.security=TRACE

# ===============================
# CONFIGURATION TWILIO envoie MESSAGE
# ===============================

twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.from-number=${TWILIO_FROM_NUMBER}



#Important : définis les trois variables d'environnement dans ton système
# et ne publie jamais ton authToken.

#Tu n'as pas besoin d'ajouter @Value sur chaque champ : @ConfigurationProperties s'en charge
#@ConfigurationProperties(prefix = "twilio") : associe automatiquement les propriétés YAML aux champs Java.

