<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <h1>Register</h1>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Créer un compte</h4>
                </div>

                <div class="card-body">

                    <div th:if="${success}"
                         class="alert alert-success"
                         th:text="${success}">
                    </div>

                    <div th:if="${error}"
                         class="alert alert-danger"
                         th:text="${error}">
                    </div>

                    <form th:action="@{/inscription}"
                          th:object="${inscription}"
                          method="post">

                        <div class="mb-3">
                            <label class="form-label">
                                Firstname
                            </label>

                            <input type="text"
                                   th:field="*{firstname}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Lastname
                            </label>

                            <input type="text"
                                   th:field="*{lastname}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   th:field="*{username}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Mot de passe
                            </label>

                            <input type="password"
                                   th:field="*{password}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Confirmer le mot de passe
                            </label>

                            <input type="password"
                                   th:field="*{confirmPassword}"
                                   class="form-control"
                                   required>
                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100">
                            Créer mon compte
                        </button>

                    </form>

                    <div class="text-center mt-3">

                        <a th:href="@{/login}">
                            Déjà un compte ? Se connecter
                        </a>

                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
