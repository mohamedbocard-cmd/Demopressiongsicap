<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Créer un compte</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div layout:fragment="content" class="container mt-5 mb-5">

  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

      <div class="card shadow border-0">

        <div class="card-header bg-primary text-white text-center py-3">
          <h4 class="mb-0">Créer un compte</h4>
        </div>

        <div class="card-body p-4">

          <!-- Message de succès -->
          <div th:if="${success != null}"
               class="alert alert-success"
               th:text="${success}">
          </div>

          <!-- Message d'erreur -->
          <div th:if="${error != null}"
               class="alert alert-danger"
               th:text="${error}">
          </div>

          <!-- Formulaire -->
          <form th:action="@{/inscription}"
                th:object="${inscription}"
                method="post">

            <!-- Prénom -->
            <div class="mb-3">
              <label for="firstname" class="form-label">
                Firstname
              </label>

              <input type="text"
                     id="firstname"
                     th:field="*{firstname}"
                     class="form-control"
                     placeholder="saisir votre Firstname"
                     required>
            </div>

            <!-- Lastname -->
            <div class="mb-3">
              <label for="lastname" class="form-label">
                Lastname
              </label>

              <input type="text"
                     id="lastname"
                     th:field="*{lastname}"
                     class="form-control"
                     placeholder="saisir votre Lastname"
                     required>
            </div>

            <!-- Email / Username -->
            <div class="mb-3">
              <label for="username" class="form-label">
                Adresse e-mail
              </label>

              <input type="email"
                     id="username"
                     th:field="*{username}"
                     class="form-control"
                     placeholder="exemple@email.com"
                     required>
            </div>

            <!-- Mot de passe -->
            <div class="mb-3">
              <label for="password" class="form-label">
                Mot de passe
              </label>

              <input type="password"
                     id="password"
                     th:field="*{password}"
                     class="form-control"
                     placeholder="Choisissez un mot de passe"
                     minlength="8"
                     required>
            </div>

            <!-- Rôle -->
            <div class="mb-3">
              <label for="role" class="form-label">Rôle</label>

              <select id="role"
                      th:field="*{role}"
                      class="form-select"
                      required>

                <option value="">-- Sélectionner un rôle --</option>
                <option value="ROLE_ADMIN">Administrateur</option>
                <option value="ROLE_GERANT">Gérant</option>
                <option value="ROLE_EMPLOYER">Employé</option>

              </select>
            </div>


            <!-- Bouton -->
            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-primary">
                Créer mon compte
              </button>
            </div>

          </form>

          <div class="text-center mt-3">
            <span>Vous avez déjà un compte ?</span>
            <a th:href="@{/login}" class="text-decoration-none">
              Se connecter
            </a>
          </div>

        </div>
      </div>

    </div>
  </div>

</div>


</body>
</html>
