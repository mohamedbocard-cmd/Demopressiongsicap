<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate=~{dashboard/accueil} lang="fr">
<head>
    <title>Liste des commandes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <div class="row g-4">

        <div class="col-md-3">
            <div class="card card-dashboard bg-primary text-white">
                <div class="card-body">
                    <h5>Clients</h5>
                    <h2 th:text="${nombreClients}"></h2>
                </div>
            </div>
        </div>


        <div class="col-md-3">
            <div class="card text-bg-success mb-3" style="max-width: 18rem;">
                <div class="card-body">
                    <h5>Commandes</h5>
                    <h2 th:text="${nombreCommandes}"></h2>
                </div>
            </div>
        </div>


        <div class="col-md-3">
            <div class="card text-bg-secondary mb-3" style="max-width: 18rem;">
                <div class="card-body">
                    <h5>Utilisateurs</h5>
                    <h2 th:text="${nombreutilisateurs}"></h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card mb-3" style="max-width: 540px;">
                <div class="card-body">
                    <h5>Articles</h5>
                    <h2 th:text="${nombreArticles}"></h2>
                </div>
            </div>
        </div>
    </div>
</head>
<body>

<div layout:fragment="content" class="container mt-4">
    <div class="container mt-5">

        <h2>Gestion des Commandes</h2>

        <a th:href="@{/commandes/ajouter}"
           class="btn btn-success mb-3">
            Nouvelle commande
        </a>
    </div>
    <!-- Message de succès -->
    <div th:if="${success}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">

        <span th:text="${success}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close">
        </button>
    </div>

    <!-- Message d'erreur -->
    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show"
         role="alert">

        <span th:text="${error}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close">
        </button>
    </div>

        <table class="table table-bordered table-striped">

            <thead>
            <tr>
                <th>ID</th>
                <th>Numero Commande</th>
                <th>Client</th>
                <th>Date Dépôt</th>
                <th>Date Livraison</th>
                <th>Statut</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="commande : ${commandes}">

                <td th:text="${commande.id}"></td>

                <td th:text="${commande.numero_cmd}"></td>

                <td th:text="${commande.client.nom}"></td>


                <td th:text="${commande.date_Depot}"></td>

                <td th:text="${commande.date_prevue_Livraison}"></td>

                <td th:text="${commande.statut}"></td>

                <td>

                    <a th:href="@{/commandes/edit/{id}(id=${commande.id})}"
                       class="btn btn-warning btn-sm">
                        Modifier
                    </a>

                    <a th:href="@{/commandes/delete/{id}(id=${commande.id})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Voulez-vous vraiment supprimer ce commande ?');">
                        Supprimer
                    </a>

                </td>
            </tr>

            </tbody>

        </table>
    </div>
</body>
</html>
