<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate=~{dashboard/accueil} lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Commande</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm"
            crossorigin="anonymous"></script>
</head>
<body>
<div layout:fragment="content" class="container">

    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-secondary text-white">
                <h3 class="text-center">Formulaire Commande</h3>
            </div>

            <div class="card-body">
                <form th:action="@{/commandes/save}"
                      th:object="${commande}"
                      method="post">


                    <div class="mb-3">
                        <label for="numero_cmd" class="form-label">Numéro de commande</label>
                        <input type="text"
                               id="numero_cmd"
                               class="form-control"
                               th:field="*{numero_cmd}"
                               th:classappend="${#fields.hasErrors('numero_cmd')} ? 'is-invalid' : ''"
                               required>

                        <!-- Message d'erreur si la validation échoue côté serveur -->
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('numero_cmd')}" th:errors="*{numero_cmd}">
                            Veuillez saisir un numéro de commande valide.
                        </div>
                    </div>


                    <!-- Date dépôt -->
                    <div class="col-md-6 mb-3">
                        <label for="date_Depot" class="form-label">
                            Date de dépôt
                        </label>

                        <input id="date_Depot"
                               type="datetime-local"
                               class="form-control"
                               th:field="*{date_Depot}">
                    </div>

                    <!-- Date livraison -->
                    <div class="col-md-6 mb-3">
                        <label for="date_prevue_Livraison" class="form-label">
                            Date prévue de livraison
                        </label>

                        <input id="date_prevue_Livraison"
                               type="datetime-local"
                               class="form-control"
                               th:field="*{date_prevue_Livraison}">
                    </div>

            <!-- Statut -->
            <div class="mb-3">

                <label for="statut" class="form-label">
                    Statut
                </label>

                <select id="statut"
                        class="form-select"
                        th:field="*{statut}">

                    <option value="">-- Choisir un statut --</option>

                    <option value="EN_COURS">
                        En cours
                    </option>

                    <option value="TERMINEE">
                        Terminée
                    </option>

                    <option value="LIVREE">
                        Livrée
                    </option>
                    <option value="EN_ATTENTE">
                        EN_ATTENTE
                    </option>

                </select>

            </div>

            <!-- Client -->
            <div class="mb-3">

                <label for="client" class="form-label">
                    Client
                </label>

                <select id="client"
                        th:field="*{client}"
                        class="form-select"
                        required>

                    <option value="">
                        -- Sélectionner un client --
                    </option>

                    <option th:each="client : ${clients}"
                            th:value="${client.id}"
                            th:text="${client.prenom + ' ' + client.nom}">
                    </option>

                </select>

            </div>
            <!-- Boutons -->
            <div class="text-center mt-4">

                <button type="submit"
                        class="btn btn-success">
                    <i class="bi bi-check-circle"></i>
                    Enregistrer
                </button>

                <a th:href="@{/commandes/liste}"
                   class="btn btn-secondary">
                    Annuler
                </a>

            </div>

                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
