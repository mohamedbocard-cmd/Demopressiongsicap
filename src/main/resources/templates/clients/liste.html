<!DOCTYPE html>
<html lang="fr"  xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate=~{dashboard/accueil}>

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Liste des clients</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <div class="row g-4">

        <div class="col-md-3">
            <div class="card card-dashboard bg-primary text-white">
                <div class="card-body">
                    <h5>Clients</h5>
                    <h2 th:text="${nombreClients}"></h2>
                </div>
            </div>
        </div>


        <div class="col-md-3">
            <div class="card text-bg-success mb-3" style="max-width: 18rem;">
                <div class="card-body">
                    <h5>Commandes</h5>
                    <h2 th:text="${nombreCommandes}"></h2>
                </div>
            </div>
        </div>


        <div class="col-md-3">
            <div class="card text-bg-secondary mb-3" style="max-width: 18rem;">
                <div class="card-body">
                    <h5>Utilisateurs</h5>
                    <h2 th:text="${nombreutilisateurs}"></h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card mb-3" style="max-width: 540px;">
                <div class="card-body">
                    <h5>Articles</h5>
                    <h2 th:text="${nombreArticles}"></h2>
                </div>
            </div>
        </div>

    </div>
</head>

<body>
<div layout:fragment="content" class="container mt-4">


    <!-- En-tête -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Liste des clients</h2>

        <a th:href="@{/clients/ajouter}"
           class="btn btn-primary">
            + Nouveau client
        </a>

    </div>

    <!-- Message de succès -->
    <div th:if="${success}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">

        <span th:text="${success}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close">
        </button>
    </div>

    <!-- Message d'erreur -->
    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show"
         role="alert">

        <span th:text="${error}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close">
        </button>
    </div>

    <!-- Tableau -->
    <div class="table-responsive">

        <table class="table table-bordered table-hover align-middle">

            <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Téléphone</th>
                <th>Username</th>
                <th>Actions</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="client : ${clients}">

                <td th:text="${client.id}">
                    1
                </td>

                <td th:text="${client.nom}">
                </td>

                <td th:text="${client.prenom}">
                </td>

                <td th:text="${client.telephone}">
                </td>

                <td th:text="${client.username}">
                </td>

                <td>

                    <!-- Modifier -->
                    <a th:href="@{/clients/edit/{id}(id=${client.id})}"
                       class="btn btn-outline-primary">
                        Modifier
                    </a>

                    <!-- Supprimer -->
                    <a th:href="@{/clients/delete/{id}(id=${client.id})}"
                       class="btn btn-outline-danger"
                       onclick="return confirm('Voulez-vous vraiment supprimer ce client ?');">
                        Supprimer
                    </a>

                </td>

            </tr>

            <!-- Aucun client -->
            <tr th:if="${#lists.isEmpty(clients)}">

                <td colspan="6"
                    class="text-center text-muted">
                    Aucun client trouvé.
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>
</body>
</html>
