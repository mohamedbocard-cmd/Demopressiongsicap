<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.w3.org/1999/xhtml">
<head>

    <meta charset="UTF-8"/>
    <title>Pressing Karak</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f4f6f9;
        }

        .sidebar{
            min-height:100vh;
            background:#212529;
        }

        .sidebar a{
            color:white;
            text-decoration:none;
            display:block;
            padding:15px;
        }

        .sidebar a:hover{
            background:#0d6efd;
        }

        .card-dashboard{
            border:none;
            border-radius:15px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>


<div class="container-fluid">
    <div class="row">

        <!-- Menu -->
        <div class="col-md-2 sidebar">

            <h3 class="text-center text-white mt-3">
                LAVAGE-PRESSING
            </h3>

            <hr class="text-white">

            <a th:href="@{/dashboard}">
                🏠 Dashboard
            </a>
            <li sec:authorize="hasAnyRole('ADMIN', 'GERANT')">
            <a th:href="@{/clients/liste}">
                👤 Clients
            </a>
            </li>

            <li sec:authorize="hasAnyRole('ADMIN', 'GERANT')">
            <a th:href="@{/commandes/liste}">
                📦 Commandes
            </a>
            </li>

            <li sec:authorize="hasAnyRole('EMPLOYER','ADMIN', 'GERANT')">
            <a th:href="@{/articles/liste}">
                👔 Articles
            </a>
            </li>
            <li sec:authorize="hasAnyRole('ADMIN', 'GERANT')">
            <a th:href="@{/paiements/liste}">
                💳 Paiement
            </a>
            </li>

            <li sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin/liste}">
                👥 Utilisateurs
            </a>
            </li>

            <li sec:authorize="hasAnyRole('ADMIN', 'GERANT')">
                <a th:href="@{/factures/liste}">
                    📄 Facture
                </a>
            </li>



            <li sec:authorize="hasAnyRole('ADMIN', 'GERANT')">
            <a th:href="@{/categories/liste}">
                🗂️ Catégorie

            </a>
            </li>

            <li sec:authorize="hasAnyRole('ADMIN', 'GERANT')">
            <a th:href="@{/detailcommandes/liste}">
                🗃️   DetailCommandes

            </a>
            </li>

            <a th:href="@{/logout}">
                🚪 Déconnexion
            </a>

        </div>

        <!-- Contenu -->
        <div class="col-md-10">

            <nav class="navbar navbar-expand-lg bg-white shadow-sm">
                <div class="container-fluid">
                    <span class="navbar-brand">
                        Tableau de Bord
                    </span>

                    <div th:if="${firstname}">
                        Bonjour, <span th:text="${firstname}"></span> !
                    </div>

                </div>
            </nav>
            <main class="container mt-4">
                <div layout:fragment="content">
                    <div class="row g-4">

                        <div class="col-md-3">
                            <div class="card card-dashboard bg-primary text-white">
                                <div class="card-body">
                                    <h5>Clients</h5>
                                    <h2 th:text="${nombreClients}"></h2>
                                </div>
                            </div>
                        </div>


                        <div class="col-md-3">
                            <div class="card text-bg-success mb-3" style="max-width: 18rem;">
                                <div class="card-body">
                                    <h5>Commandes</h5>
                                    <h2 th:text="${nombreCommandes}"></h2>
                                </div>
                            </div>
                        </div>


                        <div class="col-md-3">
                            <div class="card text-bg-secondary mb-3" style="max-width: 18rem;">
                                <div class="card-body">
                                    <h5>Utilisateurs</h5>
                                    <h2 th:text="${nombreutilisateurs}"></h2>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-3">
                            <div class="card mb-3" style="max-width: 540px;">
                                <div class="card-body">
                                    <h5>Articles</h5>
                                    <h2 th:text="${nombreArticles}"></h2>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>     <!-- Statistiques -->

             </main>

        </div>
    </div>
</div>
</body>
</html>
