<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Pressing</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f4f6f9;
        }

        .sidebar{
            min-height:100vh;
            background:#212529;
        }

        .sidebar a{
            color:white;
            text-decoration:none;
            display:block;
            padding:15px;
        }

        .sidebar a:hover{
            background:#0d6efd;
        }

        .card-dashboard{
            border:none;
            border-radius:15px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <!-- Menu -->
        <div class="col-md-2 sidebar">

            <h3 class="text-center text-white mt-3">
                PRESSING
            </h3>

            <hr class="text-white">

            <a th:href="@{/dashboard}">
                🏠 Dashboard
            </a>

            <a th:href="@{/clients}">
                👤 Clients
            </a>

            <a th:href="@{/commandes}">
                📦 Commandes
            </a>

            <a th:href="@{/articles}">
                👔 Articles
            </a>

            <a th:href="@{/paiements}">
                💳 Paiements
            </a>

            <a th:href="@{/utilisateurs}">
                👥 Utilisateurs
            </a>

            <a th:href="@{/logout}">
                🚪 Déconnexion
            </a>

        </div>

        <!-- Contenu -->
        <div class="col-md-10">

            <nav class="navbar navbar-expand-lg bg-white shadow-sm">
                <div class="container-fluid">
                    <span class="navbar-brand">
                        Tableau de Bord
                    </span>
                </div>
            </nav>

            <div class="container mt-4">

                <!-- Statistiques -->
                <div class="row g-4">

                    <div class="col-md-3">
                        <div class="card card-dashboard bg-primary text-white">
                            <div class="card-body">
                                <h5>Clients</h5>
                                <h2 th:text="${nombreClients}">150</h2>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card card-dashboard bg-success text-white">
                            <div class="card-body">
                                <h5>Commandes</h5>
                                <h2 th:text="${nombreCommandes}">75</h2>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card card-dashboard bg-warning text-dark">
                            <div class="card-body">
                                <h5>En attente</h5>
                                <h2 th:text="${commandesAttente}">18</h2>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card card-dashboard bg-danger text-white">
                            <div class="card-body">
                                <h5>Revenus</h5>
                                <h2 th:text="${revenuTotal}">350000</h2>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Dernières commandes -->
                <div class="card mt-5 card-dashboard">

                    <div class="card-header bg-dark text-white">
                        Dernières Commandes
                    </div>

                    <div class="card-body">

                        <table class="table table-striped">

                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Client</th>
                                <th>Date Dépôt</th>
                                <th>Livraison</th>
                                <th>Statut</th>
                            </tr>
                            </thead>

                            <tbody>

                            <tr th:each="commande : ${commandes}">
                                <td th:text="${commande.id}"></td>

                                <td th:text="${commande.client.nom}"></td>

                                <td th:text="${commande.dateDepot}"></td>

                                <td th:text="${commande.datePrevueLivraison}"></td>

                                <td>
                                    <span class="badge bg-success"
                                          th:text="${commande.statut}">
                                    </span>
                                </td>
                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
