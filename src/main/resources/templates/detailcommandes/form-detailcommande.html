<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{dashboard/accueil}"
      lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Ajouter un détail de commande</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div layout:fragment="content" class="container">

    <div class="container mt-4 mb-5">

        <div class="card shadow">

            <div class="card-header">
                <h4 class="mb-0">Ajouter un détail de commande</h4>
            </div>

            <div class="card-body">

                <form th:action="@{/detailcommandes/save}"
                      th:object="${detailcommande}"
                      method="post">

                    <input type="hidden" th:field="*{id}">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label for="commande" class="form-label">
                                Numero Commande
                            </label>

                            <select id="commande"
                                    class="form-select"
                                    th:field="*{commande}"
                                    required>

                                <option value="">
                                    -- Sélectionner une commande --
                                </option>

                                <option th:each="commande : ${commandes}"
                                        th:value="${commande.id}"
                                        th:text="|${commande.id} ${commande.numero_cmd}|"
                                        th:selected="${commande.id == detailcommande?.commande?.id}">
                                </option>

                            </select>
                        </div>

                        </div>

                    <!-- Article -->
                    <div class="col-md-6 mb-3">
                        <label for="article" class="form-label">
                            Article
                        </label>

                        <select id="article"
                                class="form-select"
                                th:field="*{article}">

                            <option value="">
                                -- Sélectionner une Article --
                            </option>

                            <option th:each="article : ${articles}"
                                    th:value="${article.id}"
                                    th:text="|${article.id} ${article.nom}|"
                                    th:selected="${article.id == detailcommande?.article?.id}">
                            </option>



                        </select>
                    </div>
                    <!-- Article -->

                    <!-- Client -->
                    <div class="col-md-6 mb-3">

                        <label for="client" class="form-label">
                            Client
                        </label>

                        <select id="client"
                                th:field="*{client}"
                                class="form-select"
                                required>

                            <option value="">
                                -- Sélectionner un client --
                            </option>

                            <option th:each="client : ${clients}"
                                    th:value="${client.id}"
                                    th:text="|${client.id} ${client.nom}|"
                                    th:selected="${client.id == detailcommande?.client?.id}">
                            </option>

                        </select>

                    </div>
                    <!-- Client -->


                    <!-- Quantité -->
                        <div class="col-md-6 mb-3">

                            <label for="Quantité" class="form-label">
                                Quantité
                            </label>

                            <input type="number"
                                   id="quantité"
                                   class="form-control"
                                   th:field="*{quantité}"
                                   min="1"
                                   required>

                        </div>
                        <!-- Prix unitaire -->
                        <div class="col-md-6 mb-3">

                            <label for="prixUnitaire" class="form-label">
                                Prix unitaire
                            </label>

                            <input type="number"
                                   id="prixUnitaire"
                                   class="form-control"
                                   th:field="*{prixUnitaire}"
                                   min="0"
                                   step="0.01"
                                   required>
                        </div>

                    <div class="d-flex gap-2">

                        <button type="submit"
                                class="btn btn-primary">
                            Enregistrer
                        </button>

                        <a th:href="@{/detailcommandes/liste}"
                           class="btn btn-secondary">
                            Annuler
                        </a>

                    </div>
                </form>
            </div>
        </div>

      </div>

</div>
</body>
</html>
