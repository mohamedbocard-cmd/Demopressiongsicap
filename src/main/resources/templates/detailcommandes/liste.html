<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{dashboard/accueil}">

<head>
    <meta charset="UTF-8">
    <title>Liste des Détails Commande</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- Container principal -->
    <div class="container mt-4">

        <div class="row g-4 mb-4">

            <!-- Clients -->
            <div class="col-md-3">
                <div class="card bg-primary text-white">
                    <div class="card-body">
                        <h5>Clients</h5>
                        <h2 th:text="${nombreClients}">0</h2>
                    </div>
                </div>
            </div>

            <!-- Commandes -->
            <div class="col-md-3">
                <div class="card bg-success text-white">
                    <div class="card-body">
                        <h5>Commandes</h5>
                        <h2 th:text="${nombreCommandes}">0</h2>
                    </div>
                </div>
            </div>

            <!-- Utilisateurs -->
            <div class="col-md-3">
                <div class="card bg-secondary text-white">
                    <div class="card-body">
                        <h5>Utilisateurs</h5>
                        <h2 th:text="${nombreutilisateurs}">0</h2>
                    </div>
                </div>
            </div>

            <!-- Articles -->
            <div class="col-md-3">
                <div class="card bg-info text-white">
                    <div class="card-body">
                        <h5>Articles</h5>
                        <h2 th:text="${nombreArticles}">0</h2>
                    </div>
                </div>
            </div>

        </div>
    </div>
</head>

<body>

<div layout:fragment="content" class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2>Liste des détails commandes</h2>

            <a th:href="@{/detailcommandes/ajouter}"
               class="btn btn-outline-primary">
                + Nouveau détail commande
            </a>

        </div>

        <!-- ================= MESSAGE SUCCÈS ================= -->
        <div th:if="${success}"
             class="alert alert-success">
            <span th:text="${success}"></span>
        </div>


        <!-- ================= MESSAGE ERREUR ================= -->
        <div th:if="${error}"
             class="alert alert-danger">
            <span th:text="${error}"></span>
        </div>
    <!-- ================= MESSAGE ERREUR ================= -->



        <div class="card shadow">

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-striped">

                        <thead class="table-dark">

                        <tr>
                            <th>ID</th>
                            <th>Quantité</th>
                            <th>Prix Unitaire</th>
                            <th>Total</th>
                            <th>Commande</th>
                            <th>Article</th>
                            <th>Client</th>
                            <th>Actions</th>
                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="detailcommande : ${detailcommandes}">

                            <td th:text="${detailcommande.id}"></td>

                            <td th:text="${detailcommande.quantité}"></td>

                            <td th:text="${detailcommande.prixUnitaire}"></td>


                            <td class="text-end">

                                <strong>

                                <span th:if="${detailcommande.montant_total != null}"
                                      th:text="${#numbers.formatDecimal(detailcommande.montant_total, 1, 2)}">
                                    0.00
                                </span>

                                    <span th:unless="${detailcommande.montant_total != null}">
                                    0.00
                                </span>

                                    <span> FCFA</span>

                                </strong>

                            </td>



                            <!-- Commande -->
                            <td>
                                <span th:if="${detailcommande.commande != null}"
                                      th:text="|${detailcommande.commande.id} - ${detailcommande.commande.numero_cmd}|">
                                </span>

                                <span th:if="${detailcommande.commande == null}"
                                      class="text-muted">
                                    Aucune commande
                                </span>
                            </td>

                            <!-- Article -->
                            <td>
                                <span th:if="${detailcommande.article != null}"
                                      th:text="|${detailcommande.article.id} - ${detailcommande.article.nom}|">
                                </span>

                                <span th:if="${detailcommande.article == null}"
                                      class="text-muted">
                                    Aucun article
                                </span>
                            </td>

                            <!-- Client -->
                            <td>
                                <span th:if="${detailcommande.client != null}"
                                      th:text="|${detailcommande.client.id} - ${detailcommande.client.nom}|">
                                </span>

                                <span th:if="${detailcommande.client == null}"
                                      class="text-muted">
                                    Aucun client
                                </span>
                            </td>

                            <!-- Actions -->
                            <td>

                                <div class="d-flex gap-2">

                                    <a th:href="@{/detailcommandes/edit/{id}(id=${detailcommande.id})}"
                                       class="btn btn-sm btn-outline-warning">
                                        Modifier
                                    </a>

                                    <a th:href="@{/detailcommandes/delete/{id}(id=${detailcommande.id})}"
                                       class="btn btn-sm btn-outline-danger"
                                       onclick="return confirm('Voulez-vous supprimer ce détail de commande ?')">
                                        Supprimer
                                    </a>

                                </div>

                            </td>

                        </tr>


                        <!-- Aucun résultat -->
                        <tr th:if="${#lists.isEmpty(detailcommandes)}">

                            <td colspan="8"
                                class="text-center text-muted">
                                Aucun détail de commande trouvé.
                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>


    </div>

</body>
</html>
