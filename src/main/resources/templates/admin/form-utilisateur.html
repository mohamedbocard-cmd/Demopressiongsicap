<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate=~{dashboard/accueil} lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Utilisateur</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<div layout:fragment="content" class="container">


<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3 th:text="${utilisateur.id == null} ?
               'Ajouter un utilisateur' :
               'Modifier un utilisateur'">
            </h3>
        </div>

        <div class="card-body">

            <form th:action="@{/admin/save}"
                  th:object="${utilisateur}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label>Nom</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{nom}" required>
                </div>

                <div class="mb-3">
                    <label>Prénom</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{prenom}" required>
                </div>

                <div class="mb-3">
                    <label>Username</label>
                    <input type="text" id="username"
                           class="form-control"
                           th:field="*{username}" required>
                </div>

                <div class="mb-3">
                    <label>Mot de passe</label>
                    <input type="password"
                           class="form-control"
                           th:field="*{password}">
                </div>

                <div class="mb-3">
                    <label>Rôle</label>

                    <select class="form-select"
                            th:field="*{role}">
                        <option value="">Choisir...</option>
                        <option value="ROLE_ADMIN">Administrateur</option>
                        <option value="ROLE_GERANT">Gérant</option>
                        <option value="ROLE_EMPLOYER">Employé</option>
                    </select>

                </div>

                <button class="btn btn-success">
                    Enregistrer
                </button>

                <a th:href="@{/admin/liste}"
                   class="btn btn-secondary">
                    Retour
                </a>

            </form>

        </div>

    </div>

</div>
</div>

</body>
</html>
