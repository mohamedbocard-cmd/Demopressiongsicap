<!DOCTYPE html>
<html lang="fr"  xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate=~{dashboard/accueil}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Utilisateurs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <div class="row g-4">

        <div class="col-md-3">
            <div class="card card-dashboard bg-primary text-white">
                <div class="card-body">
                    <h5>Clients</h5>
                    <h2 th:text="${nombreClients}"></h2>
                </div>
            </div>
        </div>


        <div class="col-md-3">
            <div class="card text-bg-success mb-3" style="max-width: 18rem;">
                <div class="card-body">
                    <h5>Commandes</h5>
                    <h2 th:text="${nombreCommandes}"></h2>
                </div>
            </div>
        </div>


        <div class="col-md-3">
            <div class="card text-bg-secondary mb-3" style="max-width: 18rem;">
                <div class="card-body">
                    <h5>Utilisateurs</h5>
                    <h2 th:text="${nombreutilisateurs}"></h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card mb-3" style="max-width: 540px;">
                <div class="card-body">
                    <h5>Articles</h5>
                    <h2 th:text="${nombreArticles}"></h2>
                </div>
            </div>
        </div>
    </div>
</head>
<body>
<div layout:fragment="content" class="container mt-4">
<div class="container mt-5">


    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestion des Utilisateurs</h2>

        <a th:href="@{/admin/ajouter}"
           class="btn btn-outline-primary">
            + Ajouter un utilisateur
        </a>
    </div>
    <!-- Message de succès -->
    <div th:if="${success}" class="alert alert-success">
        <span th:text="${success}"></span>
    </div>

    <!-- Message d'erreur -->
    <div th:if="${error}" class="alert alert-danger">
        <span th:text="${error}"></span>
    </div>


    <table class="table table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Lastname</th>
            <th>Firstname</th>
            <th>Username</th>
            <th>Rôle</th>
            <th width="180">Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="user : ${utilisateurs}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.lastname}"></td>
            <td th:text="${user.firstname}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${user.role}"></td>

            <td>

                <a th:href="@{/admin/edit/{id}(id=${user.id})}"
                   class="btn btn-warning btn-sm">
                    Modifier
                </a>

                <a th:href="@{/admin/delete/{id}(id=${user.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Confirmer la suppression ?')">
                    Supprimer
                </a>

            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(utilisateurs)}">
            <td colspan="6" class="text-center">
                Aucun utilisateur enregistré.
            </td>
        </tr>

        </tbody>

    </table>

</div>
</div>
</body>
</html>
