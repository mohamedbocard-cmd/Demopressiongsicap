<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{dashboard/accueil}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des paiements</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <div class="row g-4 mb-4">

        <!-- Clients -->
        <div class="col-md-3">
            <div class="card bg-primary text-white shadow">
                <div class="card-body">
                    <h5 class="card-title">Clients</h5>
                    <h2 th:text="${nombreClients}"></h2>
                </div>
            </div>
        </div>

        <!-- Commandes -->
        <div class="col-md-3">
            <div class="card bg-success text-white shadow">
                <div class="card-body">
                    <h5 class="card-title">Commandes</h5>
                    <h2 th:text="${nombreCommandes}"></h2>
                </div>
            </div>
        </div>

        <!-- Utilisateurs -->
        <div class="col-md-3">
            <div class="card bg-secondary text-white shadow">
                <div class="card-body">
                    <h5 class="card-title">Utilisateurs</h5>
                    <h2 th:text="${nombreutilisateurs}">0</h2>
                </div>
            </div>
        </div>

        <!-- Articles -->
        <div class="col-md-3">
            <div class="card bg-warning shadow">
                <div class="card-body">
                    <h5 class="card-title">Articles</h5>
                    <h2 th:text="${nombreArticles}"></h2>
                </div>
            </div>
        </div>
    </div>
</head>
<body>

<div layout:fragment="content" class="container-fluid mt-4">

    <div class="card shadow">

        <div class="card-header d-flex justify-content-between align-items-center">

            <h2 class="mb-0">
                Liste des paiements
            </h2>

            <a th:href="@{/paiements/ajouter}"
               class="btn btn-primary">
                + Nouveau paiement
            </a>

        </div>

        <div class="card-body">

            <!-- Message succès -->
            <div th:if="${success}"
                 class="alert alert-success alert-dismissible fade show"
                 role="alert">

                <span th:text="${success}"></span>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>
            </div>

            <!-- Message erreur -->
            <div th:if="${error}"
                 class="alert alert-danger alert-dismissible fade show"
                 role="alert">

                <span th:text="${error}"></span>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>
            </div>


            <!-- Tableau responsive -->
            <div class="table-responsive">

                <table class="table table-bordered table-striped table-hover align-middle">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Montant total</th>
                        <th>Montant avance</th>
                        <th>Date paiement</th>
                        <th>Commande</th>
<!--                        <th>Numero Commande</th>-->
                        <th>Client</th>
                        <th>Mode paiement</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="paiement : ${paiement}">

                        <!-- ID -->
                        <td th:text="${paiement.id}"></td>

                        <!-- Montant total -->
                        <td>
                            <span th:text="${paiement.montantTotal}"></span>

                        </td>


                        <!-- Montant avance -->
                        <td>
                            <span th:text="${paiement.montantAvance}"></span>

                        </td>

                        <!-- Date paiement -->
                        <td th:text="${#temporals.format(paiement.datePaiement, 'dd/MM/yyyy HH:mm')}"></td>
<!--                        <td th:text="${paiement.datePaiement}"></td>-->

                        <!-- Commande -->
                        <td>
                        <span th:if="${paiement.commande != null}"
                              th:text="'Commande #' + ${paiement.commande.numero_cmd}">
                        </span>

                            <span th:if="${paiement.commande == null}"
                                  class="text-muted">
                                Aucune commande
                            </span>
                        </td>

                        <!-- Client -->
                        <td>
                            <span th:if="${paiement.commande != null
                                          and paiement.commande.client != null}"
                                  th:text="${paiement.commande.client.prenom + ' ' + paiement.commande.client.nom}">
                            </span>

                            <span th:if="${paiement.commande == null
                      or paiement.commande.client == null}"
                                  class="text-muted">
                                 Aucun client
                            </span>
                        </td>

                        <!-- Mode paiement -->
                        <td>
                            <span th:if="${paiement.modePaiement != null}"
                                  th:text="${paiement.modePaiement}"
                                  class="badge bg-primary">
                            </span>

                            <span th:if="${paiement.modePaiement == null}"
                                  class="text-muted">
                                    Non défini
                            </span>
                        </td>

                        <!-- Statut -->
                        <td>
                            <span th:if="${paiement.statut != null}"
                                  th:text="${paiement.statut}"
                                  class="badge bg-info">
                            </span>

                            <span th:if="${paiement.statut == null}"
                                  class="text-muted">
                                 Aucun statut
                   </span>
                        </td>

                        <!-- Actions -->
                        <td>
                            <a th:href="@{/paiements/edit/{id}(id=${paiement.id})}"
                               class="btn btn-warning btn-sm">
                                Modifier
                            </a>

                            <a th:href="@{/paiements/delete/{id}(id=${paiement.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Voulez-vous vraiment supprimer ce paiement ?');">
                                Supprimer
                            </a>
                        </td>

                    </tr>

                    </tbody>
                </table>

            </div>

        </div>

    </div>

</div>


</body>
</html>
