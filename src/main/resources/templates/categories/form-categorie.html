<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate=~{dashboard/accueil} lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Categorie</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm"
            crossorigin="anonymous"></script>
</head>
<body>
<div layout:fragment="content" class="container">

    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="text-center">Formulaire Categorie</h3>
            </div>

            <div class="card-body">
                <form th:action="@{/categories/save}"
                      th:object="${categorie}"
                      method="post">

                    <div class="mb-3">
                        <label for="nom" class="form-label">Nom Categorie</label>
                        <input type="text"
                               id="nom"
                               class="form-control"
                               th:field="*{nom}"
                               required>
                    </div>


                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-success">
                            Sauvegarder
                        </button>

                        <a th:href="@{/categories/liste}"
                           class="btn btn-secondary">
                            Retour
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
