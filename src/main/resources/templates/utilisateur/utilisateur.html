<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Utilisateurs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestion des Utilisateurs</h2>

        <a th:href="@{/admin/ajouter}"
           class="btn btn-success">
            + Ajouter un utilisateur
        </a>
    </div>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Email</th>
            <th>Rôle</th>
            <th width="180">Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="user : ${utilisateurs}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.nom}"></td>
            <td th:text="${user.prenom}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.role}"></td>

            <td>

                <a th:href="@{/admin/edit/{id}(id=${user.id})}"
                   class="btn btn-warning btn-sm">
                    Modifier
                </a>

                <a th:href="@{/admin/delete/{id}(id=${user.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Confirmer la suppression ?')">
                    Supprimer
                </a>

            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(utilisateurs)}">
            <td colspan="6" class="text-center">
                Aucun utilisateur enregistré.
            </td>
        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
