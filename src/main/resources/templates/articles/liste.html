<!DOCTYPE html>
<html lang="fr"  xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate=~{dashboard/accueil}>

<head>
  <meta charset="UTF-8">
  <title>Liste des articles</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <div class="row g-4">
    <div class="col-md-3">
      <div class="card mb-3" style="max-width: 540px;">
        <div class="card-body">
          <h5>Articles</h5>
          <h2 th:text="${nombreArticles}"></h2>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-md-3">
        <div class="card mb-3" style="max-width: 540px;">
          <div class="card-body">
            <h5>Categorie</h5>
            <h2 th:text="${nombrecategorie}"></h2>
          </div>
        </div>
      </div>
    </div>


  </div>
</head>

<body>
<div layout:fragment="content" class="container mt-4">


<div class="container mt-4">

  <!-- En-tête -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Liste des articles</h2>

    <a th:href="@{/articles/ajouter}"
       class="btn btn-outline-primary">
      + Nouvel article
    </a>
  </div>

  <!-- ici Message de succès -->
  <div th:if="${success}" class="alert alert-success">
    <span th:text="${success}"></span>
  </div>

  <!-- et la Message d'erreur -->
  <div th:if="${error}" class="alert alert-danger">
    <span th:text="${error}"></span>
  </div>

  <!-- Tableau -->
  <table class="table table-bordered table-striped">

    <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Nom</th>
      <th>Couleur</th>
      <th>Marque</th>
      <th>Description défauts</th>
      <th>Prix lavage</th>
      <th>Statut</th>
      <th>Numero Commande</th>
      <th>Categorie</th>
      <th>Actions</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="article : ${articles}">

      <!-- ID -->
      <td th:text="${article.id}"></td>

      <!-- Nom -->
      <td th:text="${article.nom}"></td>

      <!-- Couleur -->
      <td th:text="${article.couleur}"></td>

      <!-- Marque -->
      <td th:text="${article.marque}"></td>


      <!-- Description des défauts -->
      <td th:text="${article.descriptionDefauts}"></td>

      <!-- Prix lavage -->
      <td th:text="${article.prixLavage}"></td>


      <!-- Statut -->
      <td>
             <span th:if="${article.statut != null}"
                 th:text="${article.statut}"
                    class="badge bg-info">
             </span>

          <span th:if="${article.statut == null}"
              class="text-muted">
               Aucun statut
          </span>
      </td>

      <!-- Commande -->
      <td>
                <span th:if="${article.commande != null}"
                      th:text="|${article.commande.id} - ${article.commande.numero_cmd}|">
                </span>

        <span th:if="${article.commande == null}"
              class="text-muted">
                    Aucune Article Trouvée
                </span>
      </td>
      <!-- Commande -->

      <!-- Categorie -->
      <td>
                <span th:if="${article.categorie != null}"
                      th:text="|${article.categorie.id} - ${article.categorie.nom}|">
                </span>

        <span th:if="${article.categorie == null}"
              class="text-muted">
                    Aucune Categorie Trouvée
                </span>
      </td>
      <!-- Categorie -->


      <!-- Actions -->
      <td>
        <a th:href="@{/articles/edit/{id}(id=${article.id})}"
           class="btn btn-outline-warning">
          Modifier
        </a>

        <a th:href="@{/articles/delete/{id}(id=${article.id})}"
           class="btn btn-outline-danger"
           onclick="return confirm('Voulez-vous supprimer cet article ?')">
          Supprimer
        </a>
      </td>

    </tr>

    <!-- Aucun article -->
    <tr th:if="${#lists.isEmpty(articles)}">
      <td colspan="9" class="text-center">
        Aucun article trouvé
      </td>
    </tr>

    </tbody>
  </table>


</div>
</div>

</body>
</html>
