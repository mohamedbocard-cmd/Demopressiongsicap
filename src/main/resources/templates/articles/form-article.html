<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org"
       xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
       layout:decorate=~{dashboard/accueil} lang="fr">

<head>
    <meta charset="UTF-8"/>
    <title>Enregistrement d'un article</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>
<div layout:fragment="content" class="container">


<div class="container mt-5">

    <div class="card shadow">

        <div class="card-group">
        <h3>Enregistrer un article</h3>
        </div>

        <div class="card-body">

            <form th:action="@{/articles/save}"
                  th:object="${article}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <!-- Nom -->
                <div class="mb-3">
                    <label class="form-label">Nom de l'article</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{nom}"
                           placeholder="Ex : Costume">
                </div>

                <!-- Couleur -->
                <div class="mb-3">
                    <label class="form-label">Couleur</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{couleur}">
                </div>

                <!-- Marque -->
                <div class="mb-3">
                    <label class="form-label">Marque</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{marque}">
                </div>

                <!-- Commande -->
                <div class="mb-3">
                    <label for="commande" class="form-label">
                        Commande
                    </label>

                    <select id="commande"
                            class="form-select"
                            th:field="*{commande}">

                        <option value="">
                            -- Sélectionner une commande --
                        </option>

                        <option th:each="commande : ${commandes}"
                                th:value="${commande.id}"
                                th:text="|${commande.id} ${commande.numero_cmd}|"
                                th:selected="${commande.id == article?.commande?.id}">
                        </option>

                    </select>
                </div>
                <!-- commande -->

                <!-- categorie -->
                <div class="mb-3">
                    <label for="categorie" class="form-label">
                        Catégorie
                    </label>

                    <select id="categorie"
                            class="form-select"
                            th:field="*{categorie}">

                        <option value="">
                            -- Sélectionner une Categorie --
                        </option>

                        <option th:each="categorie : ${categories}"
                                th:value="${categorie.id}"
                                th:text="|${categorie.id} ${categorie.nom}|"
                                th:selected="${categorie.id == article?.categorie?.id}">
                        </option>



                    </select>
                </div>
                <!-- categorie -->


                <!-- Description -->
                <div class="mb-3">
                    <label class="form-label">Description des défauts</label>
                    <textarea class="form-control"
                              rows="4"
                              th:field="*{descriptionDefauts}">
                    </textarea>
                </div>

                <!-- Prix -->
                <div class="mb-3">
                    <label class="form-label">Prix de lavage (FCFA)</label>
                    <label>
                        <input type="number"
                               step="0.01"
                               class="form-control"
                               th:field="*{prixLavage}">
                    </label>
                </div>

                <div class="mb-3">
                    <label class="form-label">Quantité (FCFA)</label>
                    <label>
                        <input type="number"
                               step="0.01"
                               class="form-control"
                               th:field="*{quantité}">
                    </label>
                </div>



                <!-- Statut -->
                <div class="mb-3">
                    <label class="form-label">Statut</label>

                    <label>
                        <select class="form-select"
                                th:field="*{statut}">

                            <option value="">Sélectionner</option>
                            <option value="RECU">RECU</option>
                            <option value="EN_COURS_DE_NETTOYAGE">EN COURS DE NETTOYAGE</option>
                            <option value="PRET">Prêt</option>
                            <option value="PRET">EN_REPASSAGE</option>
                            <option value="PRET">LIVRE</option>

                        </select>
                    </label>

                </div>


                <div class="text-center">

                    <button class="btn btn-success"
                            type="submit">
                        Enregistrer
                    </button>

                    <a th:href="@{/articles/liste}"
                       class="btn btn-secondary">
                        Annuler
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>
</div>

</body>
</html>
